# Основной конфигурационный файл Spring Boot.
# Здесь — настройки, одинаковые для всех окружений.

spring:
  application:
    name: quest-platform-backend

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: 8080

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_to_long_random_string_at_least_32_chars}
    # 7 дней по умолчанию — чтобы не выкидывало каждые 15 минут.
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:10080}

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    access-key: ${S3_ACCESS_KEY:any}
    secret-key: ${S3_SECRET_KEY:any}
    bucket: ${S3_BUCKET:quest-media}
    region: ${S3_REGION:us-east-1}
    # 7 дней, чтобы браузер кешировал картинки.
    presigned-url-ttl-minutes: ${S3_PRESIGNED_TTL_MINUTES:10080}
    # Cache-Control max-age на загружаемые объекты (1 год).
    cache-control-max-age-seconds: ${S3_CACHE_MAX_AGE_SECONDS:31536000}

  livekit:
    url: ${LIVEKIT_URL:wss://quest-platform-fkt48pq6.livekit.cloud}
    api-key: ${LIVEKIT_API_KEY:placeholder}
    api-secret: ${LIVEKIT_API_SECRET:placeholder}
    token-ttl-seconds: 3600

logging:
  level:
    root: INFO
    com.questplatform: INFO
    # Убрали DEBUG/TRACE — на Railway они сильно тормозят и засоряют логи.