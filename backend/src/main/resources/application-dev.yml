# Конфигурация для профиля dev.

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quest_platform}
    username: ${DATABASE_USERNAME:quest}
    password: ${DATABASE_PASSWORD:abc123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: QuestHikariPool

  flyway:
    clean-disabled: true

logging:
  level:
    # DEBUG/TRACE оставляем только для локальной разработки.
    # На Railway переменная LOGGING_LEVEL_ORG_HIBERNATE_SQL=INFO отключит их.
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND:INFO}
    com.zaxxer.hikari: INFO